<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaVW - Premium API Dashboard</title>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Sidebar Navigation -->
    <aside class="glass-sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Manga<span>VW</span></h2>
        </div>
        <nav class="sidebar-nav">
            <a href="#dashboard" class="nav-item active" data-view="dashboard">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>
            <a href="#authors" class="nav-item" data-view="authors">
                <i class="fa-solid fa-pen-nib"></i> Authors
            </a>
            <a href="#genres" class="nav-item" data-view="genres">
                <i class="fa-solid fa-tags"></i> Genres
            </a>
            <a href="#mangas" class="nav-item" data-view="mangas">
                <i class="fa-solid fa-book-open"></i> Mangas
            </a>
            <a href="#mangadetails" class="nav-item" data-view="mangadetails">
                <i class="fa-solid fa-circle-info"></i> Manga Details
            </a>
            <a href="#chapters" class="nav-item" data-view="chapters">
                <i class="fa-solid fa-list-ol"></i> Chapters
            </a>
            <a href="#pages" class="nav-item" data-view="pages">
                <i class="fa-solid fa-images"></i> Pages
            </a>
            <div class="nav-divider"></div>
            <a href="#apikeys" class="nav-item" data-view="apikeys">
                <i class="fa-solid fa-key"></i> API Keys & Settings
            </a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <header class="top-header">
            <div class="header-title">
                <h1 id="page-title">Dashboard</h1>
            </div>
            <div class="header-actions">
                <div class="status-indicator" id="api-status">
                    <span class="pulse-dot" id="api-pulse"></span> <span id="api-text">API Connected</span>
                </div>
            </div>
        </header>

        <!-- View Container -->
        <div id="view-container" class="view-container">
            <!-- Dynamic content will be injected here by app.js -->
        </div>
    </main>

    <!-- Global Modal Overlay -->
    <div class="modal-overlay hidden" id="global-modal">
        <div class="glass-modal">
            <div class="modal-header">
                <h3 id="modal-title">Form</h3>
                <button class="btn-icon" id="btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Form dynamically injected here -->
            </div>
        </div>
    </div>

    <!-- Global Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
